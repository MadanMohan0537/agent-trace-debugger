name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          traceloom demo --db traceloom.db --json report.json --html report.html
          python -c "import json; r=json.load(open('report.json')); assert r['recovery_experiment']['recommended'] == 'after-reservation'; assert r['recovery_experiment']['simulation_only']"

