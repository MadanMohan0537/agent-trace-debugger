name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          traceloom demo --db traceloom.db --json report.json --html report.html --now-ms 1000 --ttl-ms 500
          python -c "import json; r=json.load(open('report.json')); assert r['recovery_experiment']['recommended'] == 'after-reservation'; assert r['recovery_experiment']['simulation_only']; assert r['privacy']['runs_accounted'] == 5; assert r['privacy']['retained_field_rate'] > 0"
          traceloom purge --db traceloom.db --now-ms 1500 > purge.json
          python -c "import json,sqlite3; p=json.load(open('purge.json')); assert p['deleted'] == 5; db=sqlite3.connect('traceloom.db'); assert db.execute('select count(*) from spans').fetchone()[0] == 0; assert db.execute('select count(*) from privacy_events').fetchone()[0] == 0"

