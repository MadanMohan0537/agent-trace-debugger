[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceloom"
version = "0.2.0"
description = "Privacy-aware local agent tracing, replay, and failure diagnosis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
traceloom = "traceloom.cli:main"

[tool.setuptools.packages.find]
include = ["traceloom*"]

